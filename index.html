<html>
	<head>
		<title>Ruecharli.space</title>
	</head>
	
	<style>
		body {
			background: #120000;
		}
		.container {
			background: #FFF5F7;
			
			padding: 1em;
			border: 2px solid red;
			border-radius: 0.5em;

			display: flex;

	<body>

      		<p>This is a paragraph</p>
