<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<title>Ruecharli.space</title>
		<script src="https://iframe.chat/scripts/main.min.js"></script>
		<script>chattable.initialize({stylesheet: "/chattable.css"});</script>
	</head>
	<style>
		body {
			background: black;

			padding: 0; border: 0; margin: 0;
		}
		.container {
			display: flex; justify-content: center; align-items: center;
			min-width: 100vw; min-height: 100vh;

			margin: 0 0 0;

			background:
				linear-gradient(220deg, #150029, transparent 100%),
				linear-gradient(100deg, #29001C, transparent 100%),
				linear-gradient(340deg, #290008, transparent 100%);;
		}
		.smartboard {
			min-width: 70rem; height: 50rem;

			padding: 0;
			border: 0;
			margin: 3rem 0 3rem;

			background: #120000;
		}
    		.nav {
      			width: 100%; height: 5%; border: 1px solid #F2EDEE;
    		}
    		.mainwindow {
      			width: 100%; height: 95%; border: 1px solid #F2EDEE; border-top: 0; float: left;
    		}
    		.mainwindowcontent {
      			width: 61%; height: 100%; border: 1px solid #F2EDEE; margin-left: 2%; float: left;
    		}
    		.chatdiv {
      			width: 35%; height: 100%; border-left: 1px solid #F2EDEE; float: right;
    		}
    		.chatiframe {
      			width: 100%; height: 100%; border: 0; border-top: 0; margin: 0;
		}
		h1 {
			color: #FFF5F7;
		}
		p {
			color: #FFF5F7;
		}
	</style>
	<body>
		<div class="container">
			<div class="smartboard">
				<div class="nav"></div>
        			<div class="mainwindow">
          				<div class="mainwindowcontent"></div>
          				<div class="chatdiv"><iframe class="chatiframe" src="https://iframe.chat/embed?chat=13877689" id="chattable"></iframe></div>
        			</div>
			</div>
		</div>
	</body>
</html>
