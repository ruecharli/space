<!DOCTYPE html>
<html>
	<head>
		<title>Ruecharli.space</title>
	</head>
	
	<style>
		body {
			background: #120000;
		}
		.container {
			display: flex;
			align-items: center;
			justify-content: center;

			width: 100%;
			height: 100%;
    	}
		.smartboard {
			border: 0.5em solid #333132;
			border-radius: 0.5em;

			aspect-ratio: 16 / 10;
			max-width: 60%;

			display: flex;
			align-items: center;
			justify-content: center;
		}
		.screen {
			background: #FFF5F7;
			
			padding: 1em;
			border: 2px solid #F2EDEE;
			margin: 0em;

			width: 100%;
			height: 100%;
		}
		h1 {
			color: #120000;
		}
		p {
			color: #120000;
		}
	</style>
	
	<body>
		<div class="container">
			<div class="smartboard">
				<div class="screen">
					<div>
     					<h1>This is a heading</h1>
      					<p>This is a paragraph</p>
					</div>
				</div>
			</div>
    	</div>
	</body>
	
</html>
