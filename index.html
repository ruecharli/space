<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<title>Ruecharli.space</title>
	</head>
	<style>
		body {
			background:
				linear-gradient(220deg, #150029, transparent 100%),
				linear-gradient(100deg, #29001C, transparent 100%),
				linear-gradient(340deg, #290008, transparent 100%);;
		}
		.container {
			min-width: 100vh;
			min-height: 100%;

			display: flex;
			justify-content: center;
			align-items: center;
		}
		.smartboard {
			width: 60em;
			min-height: 80vh;

			background: #120000;

			padding: 1em;
			border: 2px solid #F2EDEE;
			margin: 4em;
		}
		h1 {
			color: #FFF5F7;
		}
		p {
			color: #FFF5F7;
		}
	</style>
	<body>
		<div class="container">
			<div class="smartboard">
				<div>
					<h1>This is a heading</h1>
					<p>This is a paragraph</p>
				</div>
			</div>
		</div>
	</body>
</html>
