<!DOCTYPE html>
<html>
	<head>
		<title>Ruecharli.space</title>
	</head>
	
	<style>
		body {
			background: #120000;
		}
		.container {
			display: flex;
			align-items: center;
			justify-content: center;

			flex: 1 1 auto;
    	}
		.smartboard {
			aspect-ratio: 16 / 10;
			max-width: 60%;
			max-height: 60%;
			
			background: #FFF5F7;
			
			padding: 1em;
			border: 2px solid #F2EDEE;
			margin: 0em;
		}
		h1 {
			color: #120000;
		}
		p {
			color: #120000;
		}
	</style>
	
	<body>
		<div class="container">
			<div class="smartboard">
				<div>
     				<h1>This is a heading</h1>
      				<p>This is a paragraph</p>
				</div>
			</div>
    	</div>
	</body>
	
</html>
