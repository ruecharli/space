<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Ruecharli.space</title>
  </head>
  <style>
    body {
      background: #120000;
    }
    .container {
      min-width: 100vh;
      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;
    }
    .smartboard {
      aspect-ratio: 16 / 10;
			min-width: 60%;
      max-width: 80%;
			
			background: #FFF5F7;
			
			padding: 1em;
			border: 5px solid #F2EDEE;
			margin: 0em;
    }
    h1 {
			color: #120000;
		}
		p {
			color: #120000;
		}
  </style>
  <body>
    <div class="container">
      <div class="smartboard">
        <div>
          <h1>This is a heading</h1>
        	<p>This is a paragraph</p>
        </div>
      </div>
    </div>
  </body>
</html>
